<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="auth-shell">
        <div class="auth-card">
            <h1>Login</h1>

            <div class="demo-banner">
                Ambiente de demonstração — use o botão abaixo para explorar sem cadastro
            </div>

            <div class="alert alert-error" th:if="${param.error}">
                Usuário ou senha inválidos.
            </div>

            <div class="alert alert-info" th:if="${param.logout}">
                Você saiu com sucesso.
            </div>

            <form th:action="@{/login}" method="post">

                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text"
                           id="username"
                           name="username"
                           autocomplete="username"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password"
                           id="password"
                           name="password"
                           autocomplete="current-password"
                           required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Entrar
                </button>
            </form>

            <form th:action="@{/login}" method="post" class="guest-form">
                <input type="hidden" name="username" value="demo">
                <input type="hidden" name="password" value="demo123">
                <button type="submit" class="btn btn-secondary btn-block">
                    Entrar como visitante
                </button>
            </form>
        </div>
    </div>
</body>
</html>
