<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${place.name}">Detalhes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="app-header">
    <a class="back-link" th:href="@{/view}">← Voltar</a>
</header>
<div class="container-medium">
    <div class="place-header">
        <h1 th:text="${place.name}"></h1>
        <div class="city" th:text="${place.city}"></div>
        <div class="description" th:text="${place.description}"></div>
        <div class="rating" th:text="'⭐ ' + ${#numbers.formatDecimal(place.averageRating, 1, 1)}"></div>
        <div class="actions" th:if="${place.owner != null and place.owner.username == username}">
            <a th:href="@{/view/{id}/edit(id=${place.id})}" class="btn btn-outline">Editar lugar</a>
            <form th:action="@{/view/{id}/delete(id=${place.id})}" method="post" style="display:inline;">
                <button class="btn btn-danger-outline" type="submit">Deletar lugar</button>
            </form>
        </div>
    </div>

    <div class="section-title">Avaliações</div>

    <div class="reviews-list">
        <div th:if="${#lists.isEmpty(place.reviews)}" class="empty-reviews">
            Nenhuma avaliação ainda.
        </div>

        <div class="review-card" th:each="review : ${place.reviews}">
            <div class="review-header">
                <div class="review-rating" th:text="'⭐ ' + ${review.rating} + '/5'"></div>
                <div class="review-actions"
                     th:if="${review.owner != null and review.owner.username == username}">
                    <a th:href="@{/view/{placeId}/reviews/{reviewId}/edit(placeId=${place.id}, reviewId=${review.id})}"
                       class="btn btn-outline btn-sm">Editar</a>
                    <form th:action="@{/view/{placeId}/reviews/{reviewId}/delete(placeId=${place.id}, reviewId=${review.id})}"
                          method="post" style="display:inline;">
                        <button class="btn btn-danger-outline btn-sm" type="submit">Deletar</button>
                    </form>
                </div>
            </div>
            <div class="review-comment" th:text="${review.comment}"></div>
        </div>
    </div>

    <div class="form-card review-form">
        <h2>Adicionar avaliação</h2>
        <form th:action="@{/view/{placeId}/reviews(placeId=${place.id})}" method="post">
            <div class="form-group">
                <label>Nota (1 a 5)</label>
                <input type="number" name="rating" min="1" max="5" required />
            </div>
            <div class="form-group">
                <label>Comentário</label>
                <textarea name="comment" required></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Enviar avaliação</button>
        </form>
    </div>
</div>
</body>
</html>
