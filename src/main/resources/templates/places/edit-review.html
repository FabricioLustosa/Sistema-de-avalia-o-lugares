<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Avaliação</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="app-header">
    <a class="back-link" th:href="@{/view/{id}(id=${place.id})}">← Voltar</a>
</header>
<div class="container-narrow">
    <div class="form-card">
        <h1>Editar avaliação</h1>
        <div class="subtitle" th:text="${place.name}"></div>
        <form th:action="@{/view/{placeId}/reviews/{reviewId}/edit(placeId=${place.id}, reviewId=${review.id})}" method="post">
            <div class="form-group">
                <label>Nota (1 a 5)</label>
                <input type="number" name="rating" min="1" max="5" th:value="${review.rating}" required />
            </div>
            <div class="form-group">
                <label>Comentário</label>
                <textarea name="comment" th:text="${review.comment}" required></textarea>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Salvar avaliação</button>
        </form>
    </div>
</div>
</body>
</html>
