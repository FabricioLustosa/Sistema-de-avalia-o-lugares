<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Lugar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="app-header">
    <a class="back-link" th:href="@{/view/{id}(id=${place.id})}">← Voltar</a>
</header>
<div class="container-narrow">
    <div class="form-card">
        <h1>Editar lugar</h1>
        <form th:action="@{/view/{id}/edit(id=${place.id})}" method="post">
            <div class="form-group">
                <label>Nome</label>
                <input type="text" name="name" th:value="${place.name}" />
            </div>
            <div class="form-group">
                <label>Cidade</label>
                <input type="text" name="city" th:value="${place.city}" />
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea name="description" th:text="${place.description}"></textarea>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Salvar alterações</button>
        </form>
    </div>
</div>
</body>
</html>
