<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lugares</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="app-header">
    <div class="brand">Avaliação de Lugares</div>
    <div class="header-actions">
        <form class="search-form" th:action="@{/view}" method="get">
            <input type="text" name="city" placeholder="Buscar por cidade..." th:value="${searchCity}" />
            <button type="submit" class="btn btn-outline">Buscar</button>
        </form>
        <a th:href="@{/view/top-rated}" class="btn btn-outline">⭐ Top Rated</a>
        <a th:href="@{/view/new}" class="btn btn-primary">+ Novo Lugar</a>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-ghost" type="submit">Logout</button>
        </form>
    </div>
</header>

<div class="page-user" th:text="'Olá, ' + ${username}"></div>

<div class="container">
    <div class="info-bar">
        <span th:if="${searching}" th:text="'Resultados para: ' + ${searchCity}"></span>
        <span th:if="${topRated}">Ordenado por avaliação</span>
        <span th:if="${not searching and not topRated}" th:text="'Página ' + (${currentPage} + 1)"></span>
        <a th:if="${searching or topRated}" th:href="@{/view}" class="link-reset">← Ver todos</a>
    </div>

    <div class="grid" th:if="${not #lists.isEmpty(places)}">
        <div class="card" th:each="place : ${places}">
            <h2 th:text="${place.name}"></h2>
            <div class="city" th:text="${place.city}"></div>
            <div class="description" th:text="${place.description}"></div>
            <div class="rating" th:text="'⭐ ' + ${#numbers.formatDecimal(place.averageRating, 1, 1)}"></div>
            <a class="card-link" th:href="@{/view/{id}(id=${place.id})}">Ver detalhes →</a>
        </div>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(places)}">
        <p>Nenhum lugar encontrado.</p>
    </div>

    <div class="pagination" th:if="${totalPages > 1 and not searching and not topRated}">
        <a th:if="${currentPage > 0}" th:href="@{/view(page=${currentPage - 1}, size=${size})}">← Anterior</a>
        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
            <a th:href="@{/view(page=${i}, size=${size})}"
               th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'active' : ''"></a>
        </span>
        <a th:if="${currentPage < totalPages - 1}" th:href="@{/view(page=${currentPage + 1}, size=${size})}">Próxima →</a>
    </div>
</div>
</body>
</html>
